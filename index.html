.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 4px var(--lima),0 10px 30px rgba(0,0,0,.4)}
h1{font-size:34px;line-height:1.1;text-align:center;font-weight:800;margin-top:8px;text-wrap:balance}
.sub{font-size:14px;text-align:center;color:var(--lila);margin-bottom:6px}
.links{width:100%;display:flex;flex-direction:column;gap:12px}
.btn{display:block;background:var(--txt);color:var(--bg);text-decoration:none;text-align:center;font-weight:700;font-size:17px;padding:17px;border-radius:999px;box-shadow:0 6px 0 var(--lila);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover,.btn:focus-visible{background:var(--lima);transform:translateY(3px);box-shadow:0 3px 0 var(--lila);outline:none}

.agente{position:fixed;right:0;bottom:14px;width:130px;height:130px;border:0;background:none;cursor:pointer;transform:translateX(42%);animation:entra 1s .4s cubic-bezier(.2,.9,.3,1.2) backwards;transition:transform .3s;z-index:5}
.agente:hover,.agente:focus-visible{transform:translateX(0);outline:none}
.agente svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.saluda{transform-origin:100px 78px;animation:saluda 1.4s 1.6s 3}
.burbuja{position:absolute;right:62px;bottom:112px;width:180px;background:var(--lima);color:var(--bg);font-weight:700;font-size:13px;line-height:1.3;padding:10px 12px;border-radius:16px 16px 4px 16px;text-align:left;box-shadow:0 6px 16px rgba(0,0,0,.35);opacity:0;animation:burbuja 7s 1.6s forwards;pointer-events:none}
.agente:hover .burbuja,.agente:focus-visible .burbuja{opacity:1;animation:none}
@keyframes entra{from{transform:translateX(120%)}}
@keyframes saluda{0%,100%{transform:rotate(0)}30%{transform:rotate(-28deg)}60%{transform:rotate(8deg)}}
@keyframes burbuja{0%{opacity:0;transform:scale(.8)}8%,85%{opacity:1;transform:scale(1)}100%{opacity:0}}
footer{margin-top:18px;font-size:12px;color:var(--lila);text-align:center}
dialog{margin:auto;width:min(92vw,420px);border:0;border-radius:24px;background:var(--card);color:var(--txt);padding:26px 22px}
dialog::backdrop{background:rgba(10,4,25,.75)}
dialog h2{font-size:20px;margin-bottom:4px}
.num{font-size:13px;color:var(--lila);margin-bottom:12px}
#acertijo{font-size:18px;line-height:1.5;margin-bottom:14px}
#pista{font-size:14px;color:var(--lima);min-height:20px;margin-bottom:16px}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.fila button{flex:1;min-width:120px;border:0;border-radius:999px;padding:12px;font-weight:700;font-size:14px;cursor:pointer}
.p{background:var(--lima);color:var(--bg)}.s{background:var(--lila);color:var(--bg)}.c{background:transparent;color:var(--txt);border:2px solid var(--lila)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.grupo{display:flex;flex-direction:column;gap:12px}
button.btn{width:100%;border:0;cursor:pointer;font-family:inherit}
.flecha{display:inline-block;margin-left:6px;transition:transform .2s}
button[aria-expanded="true"] .flecha{transform:rotate(180deg)}
.submenu{display:flex;flex-direction:column;gap:12px;padding-left:22px;animation:abre .25s ease-out}
.submenu[hidden]{display:none}
.sub-btn{background:var(--lila);font-size:16px;padding:14px;box-shadow:0 5px 0 var(--lima)}
.sub-btn:hover,.sub-btn:focus-visible{background:var(--lima);box-shadow:0 2px 0 var(--lila)}
@keyframes abre{from{opacity:0;transform:translateY(-8px)}}
/* Redes sociales */
.redes{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 10px}
.redes p{font-size:13px;font-weight:500;color:var(--txt)}
.redes div{display:flex;gap:16px}
.redes a{width:48px;height:48px;border-radius:50%;background:var(--txt);color:var(--bg);display:grid;place-items:center;box-shadow:0 4px 0 var(--lila);transition:transform .15s,box-shadow .15s,background .15s}
.redes a:hover,.redes a:focus-visible{background:var(--lima);transform:translateY(2px);box-shadow:0 2px 0 var(--lila);outline:none}
.redes svg{width:24px;height:24px}
.wrap{-webkit-tap-highlight-color:transparent}
dialog{max-height:88vh;overflow:auto}

/* Computadora y tablet */
@media (min-width:768px){
  body{padding-top:28px}
  .wrap{max-width:520px;gap:12px}
  .logo{width:120px;height:120px}
  h1{font-size:38px}
  .sub{font-size:15px}
  .btn{font-size:18px;padding:14px}
  .agente{width:170px;height:170px;right:8px}
  .burbuja{right:84px;bottom:150px;width:210px;font-size:14px}
  dialog{width:480px}
}
/* Celulares chicos */
@media (max-width:360px){
  body{padding-left:14px;padding-right:14px}
  .logo{width:100px;height:100px}
  h1{font-size:28px}
  .btn{font-size:16px;padding:15px}
  .burbuja{width:150px;font-size:12px}
}
</style>
</head>

<dialog id="modal">
  <h2>Owi pregunta</h2>
  <p class="num" id="num"></p>
  <p id="acertijo"></p>
  <p id="pista"></p>
  <div class="fila">
    <button class="s" id="verPista" hidden>Ver pista</button>
    <button class="c" id="cerrar">Cerrar</button>
  </div>
</dialog>

<script>
/* ===== ACERTIJO DEL DÍA =====
   Cada día cambia solo estas tres líneas y vuelve a subir el archivo.
   Si no quieres pista, deja PISTA vacía: ""   Si no hay acertijo, deja ACERTIJO vacío: "" */
const DIA = "Lunes";
const ACERTIJO = "Tengo dientes pero no muerdo. Giro junto a mis hermanos para mover el mundo. ¿Dónde me encuentras?";
const PISTA = "";
/* ============================ */

const $ = id => document.getElementById(id);
$('abrirBuho').onclick = () => {
  if (ACERTIJO.trim()) {
    $('num').textContent = DIA ? "Acertijo del " + DIA : "Acertijo de hoy";
    $('acertijo').textContent = ACERTIJO;
  } else {
    $('num').textContent = "";
    $('acertijo').textContent = "Todavía no hay acertijo. ¡Vuelve más tarde!";
  }
  $('pista').textContent = "";
  $('verPista').hidden = !(ACERTIJO.trim() && PISTA.trim());
  $('modal').showModal();
};
$('verPista').onclick = () => { $('pista').textContent = "Pista: " + PISTA; };
$('cerrar').onclick = () => $('modal').close();
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').close(); });

$('rallyBtn').onclick = () => {
  const menu = $('rallyMenu'), abierto = menu.hidden;
  menu.hidden = !abierto;
  $('rallyBtn').setAttribute('aria-expanded', abierto);
};
</script>
